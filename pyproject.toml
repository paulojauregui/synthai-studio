[tool.poetry]
name = "synthai-studio"
version = "0.1.0"
description = "SynthAI Studio: Privacy-Preserving Synthetic Data Generation, Differential Privacy & Statistical Quality Auditing SaaS"
authors = ["Paulo Jauregui <paulo@paulojauregui.com>"]
readme = "README.md"
packages = [{include = "synthai_studio", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
duckdb = ">=1.1.0"
pyarrow = ">=17.0.0"
temporalio = ">=1.7.0"
httpx = "^0.27.0"
python-multipart = ">=0.0.9"
numpy = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
pytest = "^8.3.0"
pytest-asyncio = ">=0.24.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
